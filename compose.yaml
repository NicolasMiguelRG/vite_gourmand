services:
  php:
    build: ./docker/php
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - .:/var/www/html

  database:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: vite_gourmand
      MARIADB_USER: app
      MARIADB_PASSWORD: app_local
      MARIADB_ROOT_PASSWORD: root_local
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    
  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: app
      MONGO_INITDB_ROOT_PASSWORD: app_local
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db

  mailer:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  db_data:
  mongo_data: